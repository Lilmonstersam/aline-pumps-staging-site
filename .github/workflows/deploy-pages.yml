name: Deploy staging site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p "${{ runner.temp }}/aline-site"
          rsync -a --prune-empty-dirs \
            --exclude='/Water Pump System Supplier Sydney _ Aline Pumps Australia.html' \
            --include='*/' \
            --include='*.html' \
            --include='assets/***' \
            --include='.nojekyll' \
            --exclude='*' \
            ./ "${{ runner.temp }}/aline-site/"
          test -s "${{ runner.temp }}/aline-site/index.html"
          test -s "${{ runner.temp }}/aline-site/assets/css/site.css"
          test -f "${{ runner.temp }}/aline-site/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/aline-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
